<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-app);color:var(--color-text-primary);}
  .card{padding:24px;display:flex;gap:14px;}
  .feat{flex:1;padding:18px;border-radius:12px;background:rgba(22,32,50,.4);border:1px solid;transition:all 200ms;cursor:pointer;}
  .feat:hover{background:rgba(22,32,50,.6);}
  .ic{width:32px;height:32px;margin-bottom:10px;}
  h3{font-size:15px;font-weight:600;margin:0 0 4px;color:#d9e2ec;}
  p{font-size:12px;color:#829ab1;margin:0;line-height:1.55;}
</style></head>
<body><div class="card">
  <div class="feat" style="border-color:rgba(6,182,212,.2)">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
    <h3>Interactive Safety Map</h3><p>Color-coded heat map across state, county, and city.</p>
  </div>
  <div class="feat" style="border-color:rgba(34,197,94,.2)">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
    <h3>School Safety</h3><p>Score any school by configurable radius.</p>
  </div>
  <div class="feat" style="border-color:rgba(249,115,22,.2)">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg>
    <h3>Route Safety</h3><p>Plan your route, see segment-by-segment risk.</p>
  </div>
</div></body></html>
