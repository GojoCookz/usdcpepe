<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-app);color:var(--color-text-primary);}
  .card{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .tok{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;background:rgba(22,32,50,.4);border:1px solid rgba(36,59,85,.4);}
  .dot{width:18px;height:18px;border-radius:4px;flex-shrink:0;}
  .k{font-family:var(--font-mono);font-size:11px;color:var(--color-surface-300);flex:1;}
  .v{font-family:var(--font-mono);font-size:10px;color:var(--color-surface-500);}
</style></head>
<body><div class="card">
  <div class="tok"><div class="dot" style="background:#0d1e35;border:1px solid rgba(255,255,255,.05)"></div><div class="k">--bg-app</div><div class="v">#0d1e35</div></div>
  <div class="tok"><div class="dot" style="background:#0a1120;border:1px solid rgba(255,255,255,.05)"></div><div class="k">--bg-deep</div><div class="v">#0a1120</div></div>
  <div class="tok"><div class="dot" style="background:#e4edf8"></div><div class="k">text-primary</div><div class="v">#e4edf8</div></div>
  <div class="tok"><div class="dot" style="background:#9fb3c8"></div><div class="k">text-secondary</div><div class="v">surface-300</div></div>
  <div class="tok"><div class="dot" style="background:#627d98"></div><div class="k">text-tertiary</div><div class="v">surface-500</div></div>
  <div class="tok"><div class="dot" style="background:#486581"></div><div class="k">text-muted</div><div class="v">surface-600</div></div>
  <div class="tok"><div class="dot" style="background:rgba(36,59,85,.5);border:1px solid rgba(36,59,85,.7)"></div><div class="k">--color-border</div><div class="v">surface-700/50</div></div>
  <div class="tok"><div class="dot" style="background:rgba(34,211,238,.3);border:1px solid rgba(34,211,238,.6)"></div><div class="k">border-accent</div><div class="v">cyan-400/30</div></div>
</div></body></html>
