<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-app);}
  .card{padding:24px;display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;gap:8px;align-items:stretch;}
  .swatch{flex:1;height:64px;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-family:var(--font-mono);font-size:10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.04);}
  .name{font-family:var(--font-sans);font-size:9px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.85;}
  .label{font-size:10px;color:var(--color-surface-500);letter-spacing:.12em;text-transform:uppercase;font-weight:700;}
</style></head>
<body><div class="card">
  <div class="label">Primary · Cyan</div>
  <div class="row">
    <div class="swatch" style="background:#ecfeff;color:#0d1e35;text-shadow:none"><div class="name">50</div>#ecfeff</div>
    <div class="swatch" style="background:#cffafe;color:#0d1e35;text-shadow:none"><div class="name">100</div>#cffafe</div>
    <div class="swatch" style="background:#a5f3fc;color:#0d1e35;text-shadow:none"><div class="name">200</div>#a5f3fc</div>
    <div class="swatch" style="background:#67e8f9;color:#0d1e35;text-shadow:none"><div class="name">300</div>#67e8f9</div>
    <div class="swatch" style="background:#22d3ee;color:#0d1e35;text-shadow:none"><div class="name">400 ★</div>#22d3ee</div>
    <div class="swatch" style="background:#06b6d4"><div class="name">500</div>#06b6d4</div>
    <div class="swatch" style="background:#0891b2"><div class="name">600</div>#0891b2</div>
    <div class="swatch" style="background:#0e7490"><div class="name">700</div>#0e7490</div>
    <div class="swatch" style="background:#155e75"><div class="name">800</div>#155e75</div>
    <div class="swatch" style="background:#164e63"><div class="name">900</div>#164e63</div>
  </div>
</div></body></html>
