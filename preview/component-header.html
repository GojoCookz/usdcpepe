<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-app);color:var(--color-text-primary);}
  .card{padding:18px;}
  .header{height:64px;border-radius:10px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;
    background:rgba(13,28,50,0.97);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(34,211,238,0.10);
    box-shadow:0 1px 0 rgba(34,211,238,.10), 0 4px 28px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);}
  .left{display:flex;align-items:center;gap:12px;}
  .helmet{font-size:30px;line-height:1;}
  .wm{font-size:17px;font-weight:700;letter-spacing:-.005em;color:rgba(255,255,255,.95);}
  .wm .n{color:#67e8f9;}
  nav{display:flex;gap:4px;}
  nav a{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:500;color:#829ab1;text-decoration:none;}
  nav a.active{color:#a5f3fc;background:rgba(34,211,238,.14);box-shadow:inset 0 0 0 1px rgba(34,211,238,.30), 0 1px 0 rgba(34,211,238,.04);}
</style></head>
<body><div class="card">
  <div class="header">
    <div class="left"><span class="helmet">⛑️</span><span class="wm">Safe<span class="n">N</span>Sound</span></div>
    <nav>
      <a class="active" href="#">Map</a>
      <a href="#">State Overview</a>
      <a href="#">School Safety</a>
      <a href="#">Route Safety</a>
      <a href="#">Transparency</a>
    </nav>
  </div>
</div></body></html>
