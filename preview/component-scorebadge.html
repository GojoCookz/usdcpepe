<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-app);color:var(--color-text-primary);}
  .card{padding:24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .bg{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .badge{display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;border-radius:9999px;}
  .l{font-size:11px;font-weight:500;}
  .lg{width:80px;height:80px;font-size:24px;}
  .md{width:56px;height:56px;font-size:18px;}
  .sm{width:40px;height:40px;font-size:14px;}
</style></head>
<body><div class="card">
  <div class="bg"><div class="badge lg" style="background:#34d399;box-shadow:0 0 20px #34d39940">87</div><span class="l" style="color:#34d399">Safe</span></div>
  <div class="bg"><div class="badge lg" style="background:#22c55e;box-shadow:0 0 20px #22c55e40">74</div><span class="l" style="color:#22c55e">Low Risk</span></div>
  <div class="bg"><div class="badge md" style="background:#fbbf24;box-shadow:0 0 20px #fbbf2440">62</div><span class="l" style="color:#fbbf24">Caution</span></div>
  <div class="bg"><div class="badge md" style="background:#f97316;box-shadow:0 0 20px #f9731640">45</div><span class="l" style="color:#f97316">Elevated</span></div>
  <div class="bg"><div class="badge sm" style="background:#be1c1c;box-shadow:0 0 20px #be1c1c40">28</div><span class="l" style="color:#be1c1c">High Risk</span></div>
  <div class="bg"><div class="badge sm" style="background:#82123b;box-shadow:0 0 20px #82123b40">11</div><span class="l" style="color:#82123b">Critical</span></div>
</div></body></html>
