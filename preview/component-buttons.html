<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-app);color:var(--color-text-primary);}
  .card{padding:24px;display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;gap:12px;align-items:center;}
  .btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-sans);font-weight:500;font-size:14px;padding:10px 18px;border-radius:8px;border:0;cursor:pointer;transition:all 150ms;}
  .primary{background:#06b6d4;color:#fff;box-shadow:0 10px 32px rgba(6,182,212,.20);}
  .primary:hover{background:#22d3ee;}
  .secondary{background:rgba(22,32,50,.6);color:#9fb3c8;border:1px solid rgba(36,59,85,.5);}
  .ghost{background:transparent;color:#67e8f9;border:1px solid rgba(34,211,238,.30);}
  .danger{background:linear-gradient(135deg,#ef4444 0%,#b91c1c 100%);color:#fff;box-shadow:0 4px 20px rgba(239,68,68,.55), inset 0 1px 0 rgba(255,255,255,.18);width:44px;height:44px;padding:0;border-radius:9999px;justify-content:center;}
  .label{font-size:10px;color:var(--color-surface-500);letter-spacing:.12em;text-transform:uppercase;font-weight:700;}
</style></head>
<body><div class="card">
  <div class="label">Buttons</div>
  <div class="row">
    <button class="btn primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      Explore the Map
    </button>
    <button class="btn secondary">How It Works</button>
    <button class="btn ghost">Got it</button>
    <button class="btn danger" aria-label="Submit a report">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495ZM10 5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 10 5Zm0 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd"/></svg>
    </button>
  </div>
</div></body></html>
