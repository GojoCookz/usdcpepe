<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-app);color:var(--color-text-primary);font-family:var(--font-sans);}
  .card{padding:22px;}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;font-size:11.5px;line-height:1;}
  .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  .lbl{font-size:10px;color:#627d98;letter-spacing:.12em;text-transform:uppercase;font-weight:700;width:120px;}
</style></head>
<body><div class="card">
  <div class="row"><span class="lbl">Risk pills</span>
    <span class="pill" style="background:rgba(52,211,153,.15);color:#34d399;border:1px solid rgba(52,211,153,.3)">● Safe · 87</span>
    <span class="pill" style="background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.3)">● Caution · 62</span>
    <span class="pill" style="background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.3)">● High Risk · 28</span>
  </div>
  <div class="row"><span class="lbl">Nav active</span>
    <span class="pill" style="padding:7px 14px;color:#a5f3fc;background:rgba(34,211,238,.14);box-shadow:inset 0 0 0 1px rgba(34,211,238,.30);font-weight:500;">Map</span>
    <span class="pill" style="padding:7px 14px;color:#829ab1;font-weight:500;">State Overview</span>
  </div>
  <div class="row"><span class="lbl">Disclaimer pill</span>
    <span class="pill" style="background:rgba(8,4,0,.38);border:1px solid rgba(217,119,6,.14);color:rgba(254,243,199,.4);font-size:9.5px;padding:5px 9px;">⚠ Estimates only. <u>Methodology</u>.</span>
  </div>
</div></body></html>
