<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-app);}
  .card{padding:24px;display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;gap:8px;}
  .swatch{flex:1;height:64px;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-family:var(--font-mono);font-size:10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.04);}
  .name{font-family:var(--font-sans);font-size:9px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.85;}
  .label{font-size:10px;color:var(--color-surface-500);letter-spacing:.12em;text-transform:uppercase;font-weight:700;}
</style></head>
<body><div class="card">
  <div class="label">Surface · Deep navy</div>
  <div class="row">
    <div class="swatch" style="background:#f0f4f8;color:#0d1e35;text-shadow:none"><div class="name">50</div>#f0f4f8</div>
    <div class="swatch" style="background:#d9e2ec;color:#0d1e35;text-shadow:none"><div class="name">100</div>#d9e2ec</div>
    <div class="swatch" style="background:#bcccdc;color:#0d1e35;text-shadow:none"><div class="name">200</div>#bcccdc</div>
    <div class="swatch" style="background:#9fb3c8;color:#0d1e35;text-shadow:none"><div class="name">300</div>#9fb3c8</div>
    <div class="swatch" style="background:#829ab1"><div class="name">400</div>#829ab1</div>
    <div class="swatch" style="background:#627d98"><div class="name">500</div>#627d98</div>
    <div class="swatch" style="background:#486581"><div class="name">600</div>#486581</div>
    <div class="swatch" style="background:#243b55"><div class="name">700</div>#243b55</div>
    <div class="swatch" style="background:#162032"><div class="name">800 ★</div>#162032</div>
    <div class="swatch" style="background:#0d1b2a"><div class="name">900</div>#0d1b2a</div>
  </div>
</div></body></html>
