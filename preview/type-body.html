<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-app);color:var(--color-text-primary);}
  .card{padding:24px;display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;align-items:baseline;gap:16px;padding-bottom:10px;border-bottom:1px solid rgba(36,59,85,.35);}
  .row:last-child{border-bottom:0;}
  .meta{width:120px;flex-shrink:0;font-family:var(--font-mono);font-size:10px;color:var(--color-surface-500);}
</style></head>
<body><div class="card">
  <div class="row"><div class="meta">Body lg · 20 / 400</div><div style="font-size:20px;color:#9fb3c8;line-height:1.6;">Data-driven safety insights for families and women.</div></div>
  <div class="row"><div class="meta">Body · 16 / 400</div><div style="font-size:16px;color:#9fb3c8;line-height:1.6;">Search any school in the US to see the safety score for the surrounding area.</div></div>
  <div class="row"><div class="meta">Small · 14 / 500</div><div style="font-size:14px;color:#bcccdc;font-weight:500;">Analysis radius</div></div>
  <div class="row"><div class="meta">Caption · 12 / 400</div><div style="font-size:12px;color:#627d98;">Score for 1-mile radius around this school</div></div>
  <div class="row"><div class="meta">Eyebrow · 10 / 700</div><div style="font-size:10px;color:#829ab1;text-transform:uppercase;letter-spacing:.15em;font-weight:700;">Safe Index</div></div>
</div></body></html>
