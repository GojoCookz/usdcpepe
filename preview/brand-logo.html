<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-app);color:var(--color-text-primary);}
  .card{padding:24px;display:flex;flex-direction:column;gap:12px;}
  .lockup{display:flex;align-items:center;gap:14px;}
  .helmet{font-size:44px;line-height:1;filter:drop-shadow(0 0 8px rgba(255,255,255,.18));}
  .wm{font-size:32px;font-weight:700;letter-spacing:-.01em;color:rgba(255,255,255,.95);}
  .wm .n{color:#67e8f9;}
  .meta{display:flex;gap:24px;font-family:var(--font-mono);font-size:10px;color:var(--color-surface-500);padding-top:6px;border-top:1px solid rgba(36,59,85,.35);}
  .meta span b{color:#bcccdc;font-weight:600;}
</style></head>
<body><div class="card">
  <div class="lockup"><span class="helmet">⛑️</span><span class="wm">Safe<span class="n">N</span>Sound</span></div>
  <div class="meta">
    <span>icon · <b>⛑️ emoji</b></span>
    <span>wordmark · <b>Inter 700</b></span>
    <span>accent · <b>cyan-300 #67e8f9</b></span>
  </div>
</div></body></html>
