<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-app);color:var(--color-text-primary);font-family:var(--font-sans);}
  .card{padding:22px;display:flex;gap:16px;align-items:center;}
  .flag{width:80px;height:54px;border-radius:6px;border:1px solid rgba(36,59,85,.5);object-fit:cover;box-shadow:0 4px 14px rgba(0,0,0,.4);}
  .stack{display:flex;gap:10px;align-items:center;}
  .lbl{font-size:11px;color:#627d98;}
  .col{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .nm{font-family:var(--font-mono);font-size:10px;color:#9fb3c8;}
</style></head>
<body><div class="card">
  <div class="col"><img class="flag" src="../assets/flags/ca.png" alt="California"><span class="nm">ca.png</span></div>
  <div class="col"><img class="flag" src="../assets/flags/ny.png" alt="New York"><span class="nm">ny.png</span></div>
  <div class="col"><img class="flag" src="../assets/flags/tx.png" alt="Texas"><span class="nm">tx.png</span></div>
  <div class="col"><img class="flag" src="../assets/flags/fl.png" alt="Florida"><span class="nm">fl.png</span></div>
  <div style="flex:1;font-size:12px;color:#829ab1;line-height:1.5;">State flag pins for map state selector. ~80×54 raster pulled from public Wikipedia SVGs. Sample of 4; product ships all 50.</div>
</div></body></html>
