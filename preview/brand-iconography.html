<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>

  .card{padding:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .ic{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;background:rgba(22,32,50,.4);border:1px solid rgba(36,59,85,.4);border-radius:10px;}
  .ic svg{stroke:#67e8f9;}
  .ic .nm{font-size:11px;color:#9fb3c8;font-weight:500;}
  .ic .pth{font-family:var(--font-mono);font-size:9px;color:#486581;}
</style></head>

  <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg><span class="nm">GraduationCap</span><span class="pth">lucide</span></div>

  <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span class="nm">Shield</span><span class="pth">lucide</span></div>
  <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span class="nm">Search</span><span class="pth">lucide</span></div>
