<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-app);color:var(--color-text-primary);}
  .card{padding:24px;display:flex;flex-direction:column;gap:14px;}
  .label{font-size:10px;color:var(--color-surface-500);letter-spacing:.12em;text-transform:uppercase;font-weight:700;}
  .input{position:relative;display:flex;align-items:center;background:rgba(22,32,50,.6);border:1px solid rgba(36,59,85,.6);border-radius:8px;padding:10px 14px 10px 38px;color:#bcccdc;font-size:14px;}
  .input svg{position:absolute;left:12px;color:#627d98;}
  .input.focus{border-color:rgba(34,211,238,.5);box-shadow:0 0 0 3px rgba(34,211,238,.15);}
  .radius{display:inline-flex;gap:4px;background:rgba(22,32,50,.6);border:1px solid rgba(36,59,85,.4);border-radius:8px;padding:4px;align-self:flex-start;}
  .radius button{font:inherit;padding:6px 12px;border-radius:6px;border:0;background:transparent;color:#829ab1;font-size:13px;cursor:pointer;}
  .radius button.on{background:#06b6d4;color:#fff;}
</style></head>
<body><div class="card">
  <div class="label">Search input · default</div>
  <div class="input">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    Search for a school by name...
  </div>
  <div class="label">Search input · focus</div>
  <div class="input focus" style="color:#e4edf8">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    Lincoln High School
  </div>
  <div class="label">Segmented control</div>
  <div class="radius">
    <button>0.5 mi</button><button class="on">1 mi</button><button>3 mi</button><button>5 mi</button>
  </div>
</div></body></html>
