<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-app);color:var(--color-text-primary);font-family:var(--font-sans);}
  .card{padding:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .stat{padding:14px;background:rgba(22,32,50,.4);border:1px solid rgba(36,59,85,.4);border-radius:10px;text-align:center;}
  .v{font-size:24px;font-weight:800;color:#22d3ee;line-height:1.05;}
  .l{font-size:10px;color:#627d98;margin-top:5px;letter-spacing:.02em;}
</style></head>
<body><div class="card">
  <div class="stat"><div class="v">50</div><div class="l">States Covered</div></div>
  <div class="stat"><div class="v">44,891</div><div class="l">Schools Indexed</div></div>
  <div class="stat"><div class="v">7</div><div class="l">Safety Factors</div></div>
  <div class="stat"><div class="v">100%</div><div class="l">Public Data</div></div>
</div></body></html>
